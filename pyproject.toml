[project]
name = "glinkfix"
version = "2.2.5"
description = "Google Drive Link Fixer"
authors = [{ name = "Peter Nardi", email = "geozeke@gmail.com" }]
maintainers = [{ name = "Peter Nardi", email = "geozeke@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
keywords = [
	"glinkfix",
	"google",
	"drive",
	"link",
	"curl",
	"markdown",
	"embed",
	"image",
	"download",
]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Natural Language :: English",
	"Operating System :: OS Independent",
	"Topic :: Utilities",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
]
dependencies = [
	"pyperclip>=1.9.0",
]

[project.urls]
"Source Code" = "https://github.com/geozeke/glinkfix"
"Bug Tracker" = "https://github.com/geozeke/glinkfix/issues"

[project.scripts]
glinkfix = "glinkfix.app:main"

[build-system]
requires = ["uv-build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
	"assets/**",
	"CHANGELOG.md",
	"changelogs/**",
	"justfile",
	"scripts/**",
	"tests/**",
]
source-exclude = [
	"global-gitignore.txt",
	".mypy_cache",
	".gitignore",
	"uv.lock",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = ["except pc.PyperclipException:", "if __name__ == \"__main__\":"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "scripts"]
required-version = "==1.3.2"
search-path = [".", "src"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.1,<8",
    "pyrefly==1.3.2",
    "pytest>=8.3.3,<10",
    "ruff>=0.16,<1",
    "types-pyperclip>=1.11.0.20260508",
]
