name: Dependabot metadata

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Verify update metadata
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.repository == 'geozeke/glinkfix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Record verified metadata
        env:
          DEPENDENCY_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          jq --null-input \
            --arg ecosystem "$DEPENDENCY_ECOSYSTEM" \
            --arg maintainer_changes "$MAINTAINER_CHANGES" \
            --arg pr_url "$PR_URL" \
            --arg update_type "$UPDATE_TYPE" \
            '{
              ecosystem: $ecosystem,
              maintainer_changes: $maintainer_changes,
              pr_url: $pr_url,
              update_type: $update_type
            }' > "$RUNNER_TEMP/dependabot-metadata.json"

      - name: Upload verified metadata
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-metadata
          path: ${{ runner.temp }}/dependabot-metadata.json
          retention-days: 1
