name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: extractions/setup-just@v3
      - name: Sync locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate release metadata and notes
        id: metadata
        run: >-
          uv run python -m scripts.validate_release "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
      - name: Run release quality checks
        run: |
          just lint
          just typecheck
          just test
      - name: Build distributions
        run: |
          uv build --sdist --no-sources
          uv build --wheel --no-sources
      - name: Extract release notes
        run: >-
          uv run python -m scripts.extract_release_notes "$GITHUB_REF_NAME"
          .release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/
            .release-notes.md
          include-hidden-files: true

  publish-prerelease:
    name: Publish prerelease to TestPyPI
    if: needs.build.outputs.prerelease == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/glinkfix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-stable:
    name: Publish stable release to PyPI
    if: needs.build.outputs.prerelease == 'false'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glinkfix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-prerelease:
    name: Publish GitHub prerelease
    if: needs.build.outputs.prerelease == 'true'
    needs: [build, publish-prerelease]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="glinkfix $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" \
              --notes-file .release-notes.md --prerelease
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$title" \
              --notes-file .release-notes.md --prerelease --verify-tag
          fi

  github-stable:
    name: Publish stable GitHub release
    if: needs.build.outputs.prerelease == 'false'
    needs: [build, publish-stable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="glinkfix $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" \
              --notes-file .release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$title" \
              --notes-file .release-notes.md --verify-tag
          fi
      - name: Update stable installation tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_release_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          python -m scripts.update_latest_tag "$GITHUB_REF_NAME" \
            "$latest_release_tag" "$GITHUB_SHA"
